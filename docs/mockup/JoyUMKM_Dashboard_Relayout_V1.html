    <div class="main-shell">
      <header class="topbar">

  <div id="modal-root"></div><div id="toast-root" class="toast-container" aria-live="polite"></div>
  <script>
    const I=id=>`<svg class="icon" aria-hidden="true"><use href="#i-${id}"></use></svg>`;
    const COLORS=['#0207CA','#0297DE','#FC734D','#0D234E','#7C8EE8'];
    const NAV=[['home','Home','home'],['factor','Factor Profile','radar'],['distribution','Distribution','circle'],['comparison','Comparison','chart'],['umkm','UMKM & Recommendations','store'],['form','Form Data','file']];
    const INITIAL=[
      {id:'u1',name:'Kawalogy',location:'DKI Jakarta',sector:'Makanan & Minuman',revenue:15000000,score:96.5,scores:{INS:100,ECT:93.8,OPS:95.8},status:'final',answered:16},
      {id:'u2',name:'Warjon',location:'DKI Jakarta',sector:'Makanan & Minuman',revenue:50000000,score:95.1,scores:{INS:100,ECT:93.8,OPS:91.7},status:'final',answered:16},
      {id:'u3',name:'Upside Down',location:'Sumatera Utara',sector:'Grosir & Retail',revenue:5000000,score:91.7,scores:{INS:100,ECT:87.5,OPS:87.5},status:'final',answered:16},
      {id:'u4',name:'ayam geprek',location:'Nusa Tenggara Barat',sector:'Makanan & Minuman',revenue:2000000,score:87.5,scores:{INS:83.3,ECT:87.5,OPS:91.7},status:'draft',answered:16}
    ];
    const QUESTIONS={
      INS:['Usaha memiliki pencatatan keuangan yang konsisten.','Arus kas usaha dipantau secara berkala.','Target dan realisasi penjualan dicatat.','Keuangan pribadi dan usaha dipisahkan.','Stok atau persediaan terpantau dengan baik.','Perhitungan harga pokok dan margin dilakukan.'],
      ECT:['Usaha memanfaatkan saluran promosi digital.','Usaha mengenal segmen pelanggan utamanya.','Kepuasan pelanggan dipantau secara rutin.','Keluhan pelanggan ditangani dengan jelas.','Tren pasar dan pesaing dievaluasi.'],
      OPS:['Prosedur operasional usaha terdokumentasi.','Kualitas produk atau layanan dijaga konsisten.','Pengadaan bahan baku dikelola terencana.','Pembagian tanggung jawab operasional jelas.','Perbaikan operasional dilakukan secara berkala.']
    };
    const getSaved=()=>{try{const o=JSON.parse(localStorage.getItem('joyumkm-layout-v1'));return Array.isArray(o)&&o.length?o:null}catch{return null}};
    let umkm=getSaved()||structuredClone(INITIAL),page='home',selectedFactor='u4',selectedForm='',factorTab='INS',selectedCompare=['u1','u2','u3','u4'],pendingCompare='',umkmSearch='',umkmSector='',umkmStatus='',sortBy='score',sortDirection='desc',currentPage=1,pageSize=10,modal=null;
    let answers={},formSaved={};try{formSaved=JSON.parse(localStorage.getItem('joyumkm-forms-v1'))||{}}catch{}
    const save=()=>{try{localStorage.setItem('joyumkm-layout-v1',JSON.stringify(umkm));localStorage.setItem('joyumkm-forms-v1',JSON.stringify(formSaved))}catch{}};
    const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
    const fmt=n=>Number(n).toLocaleString('id-ID',{maximumFractionDigits:1,minimumFractionDigits:1});
    const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
    const avg=(list)=>list.length?list.reduce((a,b)=>a+b,0)/list.length:0;
    const validScores=a=>a.filter(x=>Number.isFinite(Number(x))).map(Number);
    const portfolio=()=>avg(umkm.map(u=>u.score).filter(n=>typeof n==='number'));
    const baseline=f=>avg(validScores(umkm.map(u=>u.scores?.[f]).filter(v=>v!==null&&v!==undefined)));
    const sectorData=()=>{const sectors=[...new Set(umkm.map(u=>u.sector))];return sectors.map(sector=>({sector,items:umkm.filter(x=>x.sector===sector),score:avg(umkm.filter(x=>x.sector===sector).map(x=>x.score).filter(n=>Number.isFinite(n)))})).sort((a,b)=>a.score-b.score)};
    const category=score=>score===null||score===undefined?'Belum Dinilai':score>=85?'Sangat Baik':score>=70?'Baik':score>=55?'Cukup':score>=40?'Kurang':'Kritis';
    const catCls=cat=>cat==='Sangat Baik'||cat==='Baik'?'pill-green':cat==='Cukup'?'pill-amber':cat==='Belum Dinilai'?'pill-muted':'pill-orange';
    const tag=(label,cls)=>`<span class="pill ${cls}">${esc(label)}</span>`;
    const heading=(eyebrow,title,desc,actions='')=>`<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`;
    const sectionHead=(title,desc,right='')=>`<div class="section-top"><div><h2 class="section-title">${title}</h2>${desc?`<p class="section-desc">${desc}</p>`:''}</div>${right}</div>`;
    const btn=(text,call,style='btn-primary',icon='')=>`<button class="btn ${style}" onclick="${call}">${icon?I(icon):''}${text}</button>`;
    const progress=(value,color=COLORS[0])=>`<div class="progress"><span style="width:${Math.max(0,Math.min(100,Number(value)||0))}%;background:${color}"></span></div>`;
    const stateLabel=u=>u.status==='final'?tag('Final','pill-green'):u.status==='draft'?tag('Sementara','pill-amber'):tag('Belum dinilai','pill-muted');
    const businessOptions=(selected='',exclude=[])=>`<option value="">Pilih UMKM...</option>`+umkm.filter(u=>!exclude.includes(u.id)).map(u=>`<option value="${esc(u.id)}" ${u.id===selected?'selected':''}>${esc(u.name)}</option>`).join('');
    function toast(message){const node=document.createElement('div');node.className='toast';node.innerHTML=`<span class="dot"></span><span>${esc(message)}</span>`;document.getElementById('toast-root').appendChild(node);setTimeout(()=>{node.style.opacity='0';setTimeout(()=>node.remove(),300)},3400)}
    function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('show')}
    function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show')}
    function navigate(name){if(!NAV.some(x=>x[0]===name))return;page=name;window.location.hash=name;render();closeSidebar();window.scrollTo({top:0,behavior:'instant'})}
    function buildNav(){document.getElementById('nav-list').innerHTML=NAV.map(([id,label,ico])=>`<button class="nav-link ${page===id?'active':''}" onclick="navigate('${id}')" ${page===id?'aria-current="page"':''}>${I(ico)}${label}</button>`).join('')}
    function donut(counts,diameter=220){const r=75,cx=110,cy=110,C=2*Math.PI*r,total=Math.max(1,counts.reduce((a,b)=>a+b.count,0));let acc=0;const circles=counts.filter(o=>o.count>0).map(o=>{const p=o.count/total,stroke=C*p,res=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${o.color}" stroke-width="19" stroke-linecap="butt" transform="rotate(-90 ${cx} ${cy})" stroke-dasharray="${stroke} ${C-stroke}" stroke-dashoffset="${-acc}" ><title>${esc(o.label)}: ${o.count} UMKM</title></circle>`;acc+=stroke;return res}).join('');return `<svg class="donut-svg" viewBox="0 0 220 220" role="img" aria-label="Grafik donat distribusi kesehatan"><circle cx="110" cy="110" r="75" fill="none" stroke="#EDF1F9" stroke-width="19"/>${circles}<text x="110" y="110" text-anchor="middle" class="donut-center-big">${counts.reduce((a,b)=>a+b.count,0)}</text><text x="110" y="132" text-anchor="middle" class="donut-center-small">Total UMKM</text></svg>`}
    function catCounts(){const cats=[['Sangat Baik','#147D5B'],['Baik','#269F74'],['Cukup','#E5A53B'],['Kurang','#FC734D'],['Kritis','#C73548'],['Belum Dinilai','#A1ACC0']];return cats.map(([label,color])=>({label,color,count:umkm.filter(u=>category(u.score)===label).length}))}
    function donutWithLegend(){const counts=catCounts();return `<div class="health-row">${donut(counts)}<div class="legend-list">${counts.map(c=>`<div class="legend-item"><span class="dot" style="background:${c.color}"></span>${c.label}<strong>${c.count}</strong></div>`).join('')}</div></div>`}
    function radar(points,compare){const centerX=260,centerY=180,r=123,ang=[-Math.PI/2,Math.PI/6,5*Math.PI/6];const p=(value,i)=>[centerX+Math.cos(ang[i])*r*(value/100),centerY+Math.sin(ang[i])*r*(value/100)];const poly=vals=>vals.map((v,i)=>p(v,i).map(a=>a.toFixed(1)).join(',')).join(' ');const line=(from,to)=>`<line x1="${from[0]}" y1="${from[1]}" x2="${to[0]}" y2="${to[1]}" stroke="#DFE5EF" stroke-width="1.2"/>`;let shapes=[25,50,75,100].map(t=>`<polygon points="${poly([t,t,t])}" fill="none" stroke="#E6EAF2" stroke-width="1.2"/>`).join('');let axes=ang.map((_,i)=>line([centerX,centerY],p(100,i))).join('');return `<div class="chart-shell radar-shell"><svg viewBox="0 0 520 340" role="img" aria-label="Radar nilai INS ECT OPS dibanding rerata portofolio">${shapes}${axes}<polygon points="${poly(compare)}" fill="rgba(2,151,222,.07)" stroke="#0297DE" stroke-width="2.2" stroke-dasharray="6 6"/><polygon points="${poly(points)}" fill="rgba(2,7,202,.13)" stroke="#0207CA" stroke-width="3"/>${points.map((v,i)=>{const xy=p(v,i);return `<circle cx="${xy[0]}" cy="${xy[1]}" r="5" fill="#0207CA" stroke="#fff" stroke-width="2"><title>${['INS','ECT','OPS'][i]}: ${fmt(v)}</title></circle>`}).join('')}<text x="260" y="35" text-anchor="middle" class="axis-text">INS</text><text x="410" y="285" text-anchor="start" class="axis-text">ECT</text><text x="110" y="285" text-anchor="end" class="axis-text">OPS</text><text x="260" y="51" text-anchor="middle" class="axis-value">100</text><text x="260" y="98" text-anchor="middle" class="axis-text">75</text><text x="260" y="127" text-anchor="middle" class="axis-text">50</text><text x="260" y="157" text-anchor="middle" class="axis-text">25</text></svg></div>`}
    function barsSvg(data,labels,colors,opts={}){const width=960,H=340,left=56,right=22,top=25,bottom=57,plotH=H-top-bottom,plotW=width-left-right;const step=plotW/data.length;let s='';for(let tick=0;tick<=100;tick+=25){const y=top+plotH*(1-tick/100);s+=`<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" class="chart-grid"/><text x="${left-13}" y="${y+4}" text-anchor="end" class="axis-text">${tick}</text>`}data.forEach((row,i)=>{const group=left+step*i,nums=row.values||[],gap=nums.length>4?5:9,bw=Math.min(67,Math.max(12,(step-42-gap*(nums.length-1))/Math.max(1,nums.length)));const total=bw*nums.length+gap*(nums.length-1),start=group+(step-total)/2;nums.forEach((v,k)=>{if(v===null||v===undefined)return;const height=plotH*Math.max(0,Math.min(100,v))/100;const y=top+plotH-height;const x=start+k*(bw+gap);s+=`<rect x="${x}" y="${y}" width="${bw}" height="${height}" rx="${Math.min(6,bw/4)}" fill="${colors[k%colors.length]}"><title>${esc(labels[k])}: ${fmt(v)}</title></rect>`});s+=`<text x="${group+step/2}" y="${H-22}" text-anchor="middle" class="axis-text">${esc(row.label)}</text>`});if(opts.baseline){let coords=data.map((row,i)=>[left+step*(i+.5),top+plotH*(1-(opts.baseline[i]||0)/100)]);s+=`<polyline points="${coords.map(x=>x.join(',')).join(' ')}" fill="none" stroke="#344761" stroke-dasharray="6 5" stroke-width="3"/>`;s+=coords.map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="4.5" fill="#344761" stroke="white" stroke-width="2"/>`).join('')}return `<div class="chart-shell"><svg viewBox="0 0 ${width} ${H}" role="img" aria-label="Grafik batang skor UMKM">${s}</svg></div>`}
    function metric(icon,label,value,foot,theme='',unit=''){return `<div class="card metric ${theme==='orange'?'metric-accent':''}"><span class="soft-corner"></span><div class="metric-icon ${theme}">${I(icon)}</div><div class="metric-label">${label}</div><div class="metric-value">${value}${unit?`<span class="metric-suffix">${unit}</span>`:''}</div><div class="metric-foot">${foot}</div></div>`}
    function homePage(){const sector=sectorData()[0],drafts=umkm.filter(u=>u.status==='draft'),best=[...umkm].sort((a,b)=>(b.score??-1)-(a.score??-1));return `<section class="page"><div class="hero"><div><span class="hello"><span class="dot"></span> Dashboard kesehatan usaha</span><h2>Selamat datang, Warjon! <span aria-hidden="true">✦</span></h2><p>Pantau seluruh portofolio UMKM, kenali performa kesehatan usaha, dan tentukan langkah pendampingan berikutnya.</p></div><button class="hero-btn" onclick="navigate('umkm')">Kelola UMKM ${I('arrow')}</button></div><div class="section-block">${sectionHead('Ringkasan portofolio','Gambaran kondisi UMKM berdasarkan penilaian terbaru.') }<div class="grid-4">${metric('store','Total responden',umkm.length+' UMKM',`${umkm.length} usaha dalam portofolio`)}${metric('trend','Rata-rata skor',fmt(portfolio()),'Kondisi keseluruhan portofolio','blue','/100')}${metric('circle','Sektor pantauan',sector?fmt(sector.score):'—',sector?esc(sector.sector):'Belum ada sektor','orange','/100')}${metric('clock','Draft aktif',drafts.length,'Evaluasi yang belum final','blue')}</div></div><div class="section-block two-col-6-4"><div class="card card-pad">${sectionHead('Distribusi kesehatan','Komposisi kategori seluruh responden.',`<button class="link" onclick="navigate('distribution')">Lihat distribusi ${I('arrow')}</button>`)}${donutWithLegend()}</div><div class="card card-pad">${sectionHead('Prioritas pendampingan','Langkah praktis berdasarkan data terbaru.')}<div class="action-row"><div class="hstack"><span class="action-icon">${I('file')}</span><div><h4>Selesaikan draft evaluasi</h4><p>${drafts.length} UMKM memiliki evaluasi berstatus sementara</p></div></div><button class="btn btn-light btn-sm" onclick="openFirstDraft()">Buka</button></div><div class="action-row"><div class="hstack"><span class="action-icon" style="background:#EAF7FF;color:var(--secondary)">${I('trend')}</span><div><h4>Bandingkan faktor kinerja</h4><p>Identifikasi keunggulan dan gap INS · ECT · OPS</p></div></div><button class="btn btn-light btn-sm" onclick="navigate('comparison')">Lihat</button></div><div class="action-row"><div class="hstack"><span class="action-icon" style="background:#EEF1FF;color:var(--primary)">${I('store')}</span><div><h4>Tinjau semua data UMKM</h4><p>Kelola profil usaha dan rekomendasi secara terpusat</p></div></div><button class="btn btn-light btn-sm" onclick="navigate('umkm')">Kelola</button></div></div></div><div class="section-block card card-pad">${sectionHead('Snapshot UMKM','Urutan performa berdasarkan skor kesehatan usaha.',`<button class="link" onclick="navigate('umkm')">Semua UMKM ${I('arrow')}</button>`)}<div class="data-table-wrap"><table class="data-table"><thead><tr><th>UMKM</th><th>Sektor usaha</th><th>Skor kesehatan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${best.slice(0,4).map(u=>`<tr><td><strong>${esc(u.name)}</strong><div class="small muted" style="margin-top:4px">${esc(u.location)}</div></td><td>${esc(u.sector)}</td><td><strong>${u.score==null?'—':fmt(u.score)+'/100'}</strong></td><td>${stateLabel(u)}</td><td><button class="table-link" onclick="openFactor('${u.id}')">Lihat faktor</button></td></tr>`).join('')}</tbody></table></div></div></section>`}
    function openFirstDraft(){const first=umkm.find(u=>u.status==='draft')||umkm[0];if(first)openForm(first.id);else toast('Belum ada UMKM untuk dievaluasi.')}
    function factorPage(){const u=umkm.find(x=>x.id===selectedFactor)||umkm[0],b=['INS','ECT','OPS'].map(baseline);if(!u)return `<section class="page">${heading('Analitik','Profil Faktor','Tambahkan UMKM terlebih dahulu.')}</section>`;const pts=['INS','ECT','OPS'].map(f=>u.scores?.[f]||0);return `<section class="page">${heading('Analitik / faktor','Profil Faktor','Bandingkan profil tiga faktor pada satu UMKM dengan rata-rata portofolio.') }<div class="card filter-panel" style="margin-bottom:19px"><div class="filter-row"><div class="field" style="flex:2"><label for="factor-select">Pilih UMKM</label><select id="factor-select" class="control" onchange="selectedFactor=this.value;render()">${businessOptions(u.id)}</select></div><div class="field"><label>Status evaluasi</label><div class="control hstack" style="justify-content:space-between">${stateLabel(u)}<span class="tiny muted">${u.answered||0}/16 terjawab</span></div></div></div></div><div class="two-col-6-4"><div class="card card-pad">${sectionHead('Radar profil usaha','Skor 0–100 · pembanding adalah rata-rata seluruh portofolio.')}${radar(pts,b)}<div class="legend-inline" style="justify-content:center;margin-top:4px"><span><i class="legend-swatch" style="background:var(--primary)"></i>${esc(u.name)}</span><span><i class="legend-swatch" style="background:var(--secondary)"></i>Rata-rata portofolio</span></div></div><div class="card card-pad">${sectionHead('Ringkasan performa',`${esc(u.name)} · ${esc(u.sector)}`)}<div class="summary-stat"><strong>${u.score==null?'—':fmt(u.score)}</strong><span class="muted">/100</span></div>${tag(category(u.score),catCls(category(u.score)))}<div style="margin:27px 0 15px;font-size:12px;font-weight:800">Skor per faktor</div>${['INS','ECT','OPS'].map((f,i)=>`<div class="factor-row"><span class="factor-name">${f}</span>${progress(u.scores?.[f]||0,COLORS[i])}<span class="factor-number">${u.scores?.[f]==null?'—':fmt(u.scores[f])}</span></div>`).join('')}<div class="note-card" style="margin-top:25px">${I('spark')}<div><h4>Pembacaan singkat</h4><p>${esc(u.name)} memiliki skor tertinggi pada faktor <strong>${['INS','ECT','OPS'].sort((x,y)=>(u.scores?.[y]||0)-(u.scores?.[x]||0))[0]}</strong>. Bandingkan setiap faktor terhadap garis rata-rata untuk menentukan tindak lanjut.</p></div></div><div style="margin-top:22px">${btn('Isi atau perbarui kuesioner',`openForm('${u.id}')`,'btn-primary','edit')}</div></div></div><div class="card card-pad section-block">${sectionHead('Detail perbandingan','Nilai tiap faktor dan pembanding portofolio.') }<div class="data-table-wrap"><table class="data-table"><thead><tr><th>UMKM / pembanding</th><th>INS</th><th>ECT</th><th>OPS</th><th>Keterangan</th></tr></thead><tbody><tr><td><strong>${esc(u.name)}</strong></td>${pts.map(x=>`<td>${fmt(x)}</td>`).join('')}<td>${stateLabel(u)}</td></tr><tr><td><strong>Rata-rata portofolio</strong></td>${b.map(x=>`<td>${fmt(x)}</td>`).join('')}<td>${umkm.length} UMKM</td></tr></tbody></table></div></div></section>`}
    function openFactor(id){selectedFactor=id;navigate('factor')}
    function distributionPage(){const sectors=sectorData();return `<section class="page">${heading('Analitik / distribusi','Distribusi Kesehatan','Lihat proporsi kategori kesehatan dan persebaran skor berdasarkan sektor usaha.') }<div class="two-col"><div class="card card-pad">${sectionHead('Kategori kesehatan',`${umkm.length} UMKM, termasuk evaluasi berstatus draft.`)}${donutWithLegend()}</div><div class="card card-pad">${sectionHead('Skor rata-rata per sektor','Rata-rata dari penilaian terbaru di setiap sektor.')}${barsSvg(sectors.map(s=>({label:s.sector,values:[s.score]})),['Rata-rata skor'],[COLORS[1]])}</div></div><div class="card card-pad section-block">${sectionHead('Wawasan per sektor','Sektor dengan skor terendah tidak otomatis berarti kategori kesehatan kritis.')}<div class="grid-2">${sectors.map((s,i)=>`<div class="card-inset" style="background:${i%2?'#F1F8FF':'#F6F7FF'}"><div class="between"><strong>${esc(s.sector)}</strong>${tag(category(s.score),catCls(category(s.score)))}</div><div class="summary-stat" style="margin-top:16px"><strong>${fmt(s.score)}</strong><span class="muted">/100</span></div>${progress(s.score,i%2?COLORS[1]:COLORS[0])}<p class="small muted" style="margin:12px 0 0">${s.items.length} UMKM · ${s.items.filter(x=>x.status==='draft').length} draft aktif</p></div>`).join('')}</div>${sectors.length?`<div class="note-card" style="margin-top:20px">${I('spark')}<div><h4>Prioritas pantauan saat ini</h4><p>Sektor <strong>${esc(sectors[0].sector)}</strong> memiliki skor rata-rata paling rendah (${fmt(sectors[0].score)}/100) dalam portofolio ini, tetapi kategorinya tetap <strong>${category(sectors[0].score)}</strong>.</p></div></div>`:''}</div></section>`}
    function comparisonPage(){const items=selectedCompare.map(id=>umkm.find(u=>u.id===id)).filter(Boolean),baselineArr=['INS','ECT','OPS'].map(baseline);return `<section class="page">${heading('Analitik / pembandingan','Perbandingan UMKM','Bandingkan hingga lima UMKM dengan rata-rata faktor seluruh portofolio.') }<div class="card card-pad" style="margin-bottom:19px">${sectionHead('Pilih UMKM untuk dibandingkan','Maksimal 5 UMKM. Pilihan dapat ditambah atau dihapus.') }<div class="filter-row"><div class="field" style="flex:2"><label>UMKM tersedia</label><select class="control" id="compare-select" onchange="pendingCompare=this.value">${businessOptions('',selectedCompare)}</select></div><div class="field" style="flex:0 0 auto;justify-content:end"><label>&nbsp;</label>${btn('Tambahkan',`addCompare()`,'btn-primary','plus')}</div><div class="field" style="flex:0 0 auto;justify-content:end"><label>&nbsp;</label>${btn('Pilih otomatis',`autoCompare()`,'btn-light','spark')}</div></div><div class="between wrap" style="margin:20px 0 11px"><span class="small muted">${items.length} dari maksimal 5 UMKM dipilih</span><button class="link" onclick="clearCompare()">Kosongkan pilihan</button></div><div class="chip-list">${items.map(u=>`<span class="select-chip">${esc(u.name)}<button aria-label="Hapus ${esc(u.name)} dari perbandingan" onclick="removeCompare('${u.id}')">${I('x')}</button></span>`).join('')||'<span class="small muted">Belum ada UMKM dipilih.</span>'}</div></div><div class="card card-pad">${sectionHead('Perbandingan skor faktor',`${items.length} UMKM dan baseline portofolio untuk INS, ECT, dan OPS.`)}${items.length?`${barsSvg(['INS','ECT','OPS'].map(f=>({label:f,values:items.map(u=>u.scores?.[f]??null)})),items.map(u=>u.name),COLORS,{baseline:baselineArr})}<div class="legend-inline" style="justify-content:center;margin:10px 0 24px">${items.map((u,i)=>`<span><i class="legend-swatch" style="background:${COLORS[i]}"></i>${esc(u.name)}</span>`).join('')}<span><i style="width:18px;border-top:2px dashed #344761"></i>Rerata portofolio</span></div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>UMKM / pembanding</th><th>INS</th><th>ECT</th><th>OPS</th><th>Skor total</th><th>Status</th></tr></thead><tbody>${items.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td>${['INS','ECT','OPS'].map(f=>`<td>${u.scores?.[f]!=null?fmt(u.scores[f]):'—'}</td>`).join('')}<td><strong>${u.score!=null?fmt(u.score):'—'}</strong></td><td>${stateLabel(u)}</td></tr>`).join('')}<tr style="background:#FAFBFF"><td><strong>Rata-rata portofolio</strong></td>${baselineArr.map(n=>`<td>${fmt(n)}</td>`).join('')}<td><strong>${fmt(portfolio())}</strong></td><td>${tag('Baseline','pill-blue')}</td></tr></tbody></table></div>`:`<div class="no-data"><div class="empty-icon">${I('chart')}</div><h3>Belum ada pilihan</h3><p>Gunakan dropdown untuk menambahkan UMKM yang ingin dibandingkan.</p></div>`}</div></section>`}
    function addCompare(){const id=document.getElementById('compare-select')?.value||pendingCompare;if(!id){toast('Pilih UMKM terlebih dahulu.');return}if(selectedCompare.length>=5){toast('Maksimal 5 UMKM dalam perbandingan.');return}if(!selectedCompare.includes(id)){selectedCompare.push(id);pendingCompare='';render()}}
    function removeCompare(id){selectedCompare=selectedCompare.filter(x=>x!==id);render()}function autoCompare(){selectedCompare=umkm.slice(0,5).map(u=>u.id);render()}function clearCompare(){selectedCompare=[];render()}
    function umkmPage(){const sectors=[...new Set(umkm.map(u=>u.sector))];let items=umkm.filter(u=>u.name.toLowerCase().includes(umkmSearch.toLowerCase())||u.location.toLowerCase().includes(umkmSearch.toLowerCase())).filter(u=>!umkmSector||u.sector===umkmSector).filter(u=>!umkmStatus||u.status===umkmStatus);items.sort((a,b)=>sortBy==='name'?sortDirection==='asc'?a.name.localeCompare(b.name):b.name.localeCompare(a.name):sortDirection==='asc'?(a.score??-1)-(b.score??-1):(b.score??-1)-(a.score??-1));let pages=Math.max(1,Math.ceil(items.length/pageSize));currentPage=Math.min(currentPage,pages);const shown=items.slice((currentPage-1)*pageSize,currentPage*pageSize);return `<section class="page">${heading('Manajemen portofolio','UMKM & Rekomendasi','Kelola data responden, status evaluasi, dan arah pendampingan.',`${btn('Tambah UMKM','openEditor()','btn-primary','plus')}`)}<div class="card card-pad">${sectionHead('Direktori UMKM',`${items.length} dari ${umkm.length} responden ditampilkan.`,`${tag('Data terbaru','pill-blue')}`)}<div class="filter-row" style="margin-bottom:20px"><div class="field" style="flex:2"><label>Cari usaha atau lokasi</label><input id="umkm-search" class="control" value="${esc(umkmSearch)}" oninput="umkmSearch=this.value;currentPage=1;refreshUmkmResults()" placeholder="Nama UMKM atau kota..."/></div><div class="field"><label>Sektor</label><select class="control" onchange="umkmSector=this.value;currentPage=1;refreshUmkmResults()"><option value="">Semua sektor</option>${sectors.map(s=>`<option value="${esc(s)}" ${s===umkmSector?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Status evaluasi</label><select class="control" onchange="umkmStatus=this.value;currentPage=1;refreshUmkmResults()"><option value="">Semua status</option><option value="final" ${umkmStatus==='final'?'selected':''}>Final</option><option value="draft" ${umkmStatus==='draft'?'selected':''}>Sementara</option><option value="none" ${umkmStatus==='none'?'selected':''}>Belum dinilai</option></select></div></div><div id="umkm-results">${umkmResults(shown,items,pages)}</div></div><div class="grid-3 section-block">${metric('store','Total UMKM',umkm.length,`${sectors.length} sektor terdaftar`)}${metric('trend','Skor kesehatan rata-rata',fmt(portfolio()),'Rata-rata portofolio','blue','/100')}${metric('clock','Evaluasi sementara',umkm.filter(u=>u.status==='draft').length,'Perlu tinjauan pendamping','orange')}</div></section>`}
    function umkmResults(shown,items,pages){return `<div class="data-table-wrap"><table class="data-table"><thead><tr><th>No</th><th>Nama UMKM</th><th>Lokasi</th><th>Sektor</th><th>Omzet</th><th><button class="link" style="font-size:10px" onclick="sortUmkm()">Skor kesehatan ↕</button></th><th>Status</th><th>Aksi</th></tr></thead><tbody>${shown.length?shown.map((u,i)=>`<tr><td>${(currentPage-1)*pageSize+i+1}</td><td><strong>${esc(u.name)}</strong></td><td>${esc(u.location)}</td><td><span class="pill pill-blue">${esc(u.sector)}</span></td><td>${money(u.revenue)}</td><td><strong>${u.score==null?'—':fmt(u.score)}</strong></td><td>${stateLabel(u)}</td><td><div class="row-actions"><button class="table-link" title="Lihat profil faktor" onclick="openFactor('${u.id}')">Faktor</button><button class="table-link" title="Isi kuesioner" onclick="openForm('${u.id}')">Form</button><button class="table-link" title="Ubah data" onclick="openEditor('${u.id}')">Ubah</button><button class="table-link danger" title="Hapus data" onclick="deleteUmkm('${u.id}')">Hapus</button></div></td></tr>`).join(''):`<tr><td colspan="8" style="text-align:center;padding:43px">Tidak ada UMKM yang cocok dengan filter.</td></tr>`}</tbody></table></div><div class="table-footer"><span class="small muted">${items.length?`${(currentPage-1)*pageSize+1}–${Math.min(currentPage*pageSize,items.length)} dari ${items.length} responden`:'Tidak ada data'}</span><div class="pagination"><select class="control" style="min-height:33px;width:115px;padding:5px 8px" onchange="pageSize=Number(this.value);currentPage=1;render()"><option value="5" ${pageSize===5?'selected':''}>5 / halaman</option><option value="10" ${pageSize===10?'selected':''}>10 / halaman</option><option value="20" ${pageSize===20?'selected':''}>20 / halaman</option></select><button ${currentPage===1?'disabled':''} onclick="currentPage--;render()">‹</button><button class="current" aria-label="Halaman ${currentPage}">${currentPage}</button><button ${currentPage===pages?'disabled':''} onclick="currentPage++;render()">›</button></div></div>`}
    function refreshUmkmResults(){const focus=document.activeElement,sel=focus?.selectionStart;document.getElementById('app').innerHTML=umkmPage();if(focus?.id==='umkm-search'){const input=document.getElementById('umkm-search');input?.focus();try{input.setSelectionRange(sel,sel)}catch{}}}
    function sortUmkm(){sortBy='score';sortDirection=sortDirection==='desc'?'asc':'desc';render()}
    function formValues(){return Object.values(QUESTIONS).flat().length}
    function factorScore(f){const a=answers[f]||{},n=Object.values(a).filter(v=>Number(v)>0).length;return n?Math.round(avg(Object.values(a).filter(v=>Number(v)>0).map(v=>Number(v)*20))*10)/10:null}
    function formStats(){const nums=['INS','ECT','OPS'].map(factorScore),count=['INS','ECT','OPS'].reduce((t,f)=>t+Object.values(answers[f]||{}).filter(x=>Number(x)>0).length,0);return {nums,count,total:16,score:nums.some(n=>n!==null)?avg(nums.filter(n=>n!==null)):null}}
    function formPage(){const u=umkm.find(x=>x.id===selectedForm),s=formStats();const choice=`<div class="card filter-panel" style="margin-bottom:19px"><div class="filter-row"><div class="field"><label for="form-choose">Pilih UMKM yang akan dievaluasi</label><select class="control" id="form-choose" onchange="selectForm(this.value)">${businessOptions(selectedForm)}</select></div>${u?`<div class="field" style="flex:0 0 auto;justify-content:end"><label>Status terakhir</label><div class="control" style="display:flex;align-items:center;border:0;padding-left:0">${stateLabel(u)}</div></div>`:''}</div></div>`;return `<section class="page">${heading('Evaluasi / kuesioner','Form Data','Isi evaluasi dan pantau perubahan skor langsung pada panel ringkasan.')}${choice}<div class="form-layout"><div class="card card-pad">${u?`${sectionHead('Evaluasi kesehatan usaha',`${esc(u.name)} · ${esc(u.sector)} · ${esc(u.location)}`,tag(`${s.count}/16 jawaban`,'pill-blue'))}<div class="factor-tabs" role="tablist" aria-label="Pilih faktor">${['INS','ECT','OPS'].map(f=>`<button role="tab" aria-selected="${factorTab===f}" class="${factorTab===f?'active':''}" onclick="factorTab='${f}';render()">${f}<span class="factor-complete">${Object.values(answers[f]||{}).filter(x=>Number(x)>0).length}/${QUESTIONS[f].length}</span></button>`).join('')}</div><div class="note-card" style="margin-top:18px">${I('help')}<div><h4>Pertanyaan demo untuk visualisasi UI</h4><p>Kalimat pertanyaan dan metode skoring di prototype ini bersifat ilustratif. Integrasi produksi wajib menggunakan instrumen dan rumus penilaian JoyUMKM yang sebenarnya.</p></div></div><div class="question-group" style="margin-top:13px"><div class="between" style="margin:25px 0 3px"><strong style="font-size:14px">Faktor ${factorTab}</strong><span class="small muted">1 = Rendah · 5 = Tinggi</span></div>${QUESTIONS[factorTab].map((q,i)=>`<div class="question-block"><div class="question-title"><span class="question-index">${String(i+1).padStart(2,'0')}</span><div><strong>${esc(q)}</strong><small>Berikan nilai sesuai kondisi usaha saat ini</small></div></div><div class="rating-options" role="group" aria-label="Nilai untuk pertanyaan ${i+1}">${[1,2,3,4,5].map(v=>`<button class="rating-option ${answers[factorTab]?.[i]===v?'active':''}" aria-pressed="${answers[factorTab]?.[i]===v}" onclick="setAnswer('${factorTab}',${i},${v})">${v}</button>`).join('')}</div></div>`).join('')}</div><div class="between wrap"><span class="small muted">${factorTab==='INS'?'Lanjutkan ke ECT':factorTab==='ECT'?'Lanjutkan ke OPS':'Seluruh faktor tersedia untuk ditinjau'}</span>${factorTab!=='OPS'?btn('Faktor berikutnya',`factorTab='${factorTab==='INS'?'ECT':'OPS'}';render()`,'btn-light','arrow'):btn('Pratinjau evaluasi','previewForm()','btn-light','eye')}</div>`:`<div class="no-data" style="min-height:440px"><div class="empty-icon">${I('file')}</div><h3>Pilih UMKM untuk memulai</h3><p>Kuesioner dan evaluasi terbaru akan ditampilkan setelah Anda memilih usaha dari daftar di atas.</p>${btn('Lihat daftar UMKM',`navigate('umkm')`,'btn-light','store')}</div>`}</div><div><div class="card card-pad sticky">${sectionHead('Live Calculation','Ringkasan simulasi nilai kuesioner.') }<div class="between" style="margin:10px 0 26px"><span class="small muted">Jawaban yang terisi</span>${tag(`${s.count}/16`,'pill-blue')}</div>${['INS','ECT','OPS'].map((f,i)=>`<div style="margin-bottom:17px"><div class="between" style="margin-bottom:9px"><strong class="small">${f}</strong><strong class="small">${factorScore(f)===null?'—':fmt(factorScore(f))}</strong></div>${progress(factorScore(f)||0,COLORS[i])}</div>`).join('')}<div style="border-top:1px solid var(--line);margin-top:22px;padding-top:19px"><div class="small muted">Skor rata-rata (faktor terisi)</div><div class="form-score" style="margin:10px 0">${s.score===null?'—':fmt(s.score)} <small>/100</small></div><div class="card-inset"><div class="tiny muted" style="font-weight:800;text-transform:uppercase">Kategori simulasi</div><div style="margin-top:8px">${tag(category(s.score),catCls(category(s.score)))}</div></div></div><div style="display:grid;gap:8px;margin-top:21px">${btn('Simpan Evaluasi',`saveForm()`,'btn-primary','save')}${btn('Pratinjau Draft',`previewForm()`,'btn-light','eye')}${btn('Reset Form',`resetForm()`,'btn-ghost')}</div></div><div class="card card-pad guide" style="margin-top:16px"><h3>${I('spark')} Panduan Pengisian</h3><p>Jawab sesuai kondisi usaha. Simpan evaluasi sementara sebelum seluruh pertanyaan terisi.</p><div class="guide-tip">Catatan: ini prototype desain. Pertanyaan resmi, status final, dan rumus penilaian perlu dihubungkan ke backend saat implementasi.</div></div></div></div></section>`}
    function selectForm(id){selectedForm=id;answers=id?structuredClone(formSaved[id]||{}):{};factorTab='INS';render()}
    function openForm(id){selectedForm=id;answers=structuredClone(formSaved[id]||{});factorTab='INS';navigate('form')}
    function setAnswer(f,i,v){if(!answers[f])answers[f]={};answers[f][i]=v;formSaved[selectedForm]=structuredClone(answers);save();const scroll=window.scrollY;render();window.scrollTo(0,scroll)}
    function resetForm(){if(!selectedForm)return;showConfirm('Reset jawaban?','Seluruh jawaban simulasi pada form ini akan dikosongkan.',()=>{answers={};formSaved[selectedForm]={};save();closeModal();render();toast('Jawaban form telah direset.')})}
    function saveForm(){if(!selectedForm){toast('Pilih UMKM terlebih dahulu.');return}const s=formStats();if(!s.count){toast('Isi minimal satu pertanyaan untuk menyimpan evaluasi.');return}formSaved[selectedForm]=structuredClone(answers);const u=umkm.find(x=>x.id===selectedForm);u.answered=s.count;u.status=s.count===16?'final':'draft';u.scores={INS:factorScore('INS'),ECT:factorScore('ECT'),OPS:factorScore('OPS')};u.score=Math.round(s.score*10)/10;save();render();toast(s.count===16?'Evaluasi lengkap disimpan (data lokal demo).':'Draft evaluasi disimpan (data lokal demo).')}
    function previewForm(){if(!selectedForm){toast('Pilih UMKM terlebih dahulu.');return}const s=formStats(),u=umkm.find(x=>x.id===selectedForm);showDialog('Pratinjau evaluasi',`<p class="muted small" style="margin-top:0">${esc(u.name)} · Ringkasan jawaban saat ini</p><div class="card-inset"><div class="between"><strong>Progress kuesioner</strong>${tag(`${s.count}/16`,'pill-blue')}</div><div style="margin-top:12px">${progress(s.count/16*100,COLORS[1])}</div></div><div class="grid-3" style="margin:20px 0">${['INS','ECT','OPS'].map(f=>`<div class="card-inset"><strong class="small">${f}</strong><div class="summary-stat" style="margin:8px 0 0"><strong style="font-size:24px">${factorScore(f)===null?'—':fmt(factorScore(f))}</strong></div></div>`).join('')}</div><p><strong>Skor sementara: ${s.score===null?'—':fmt(s.score)+'/100'}</strong></p><p class="notice">Hasil pada layar ini hanyalah simulasi desain, bukan penghitungan resmi sistem JoyUMKM.</p>`,btn('Tutup','closeModal()','btn-primary'))}
    function showDialog(title,body,foot=''){modal={title,body,foot};renderModal()}
    function showConfirm(title,description,fn){window.confirmAction=fn;showDialog(title,`<p style="line-height:1.7;color:var(--ink-muted)">${esc(description)}</p>`,`${btn('Batal','closeModal()','btn-light')}${btn('Ya, lanjutkan','confirmAction()','btn-orange')}`)}
    function closeModal(){modal=null;document.getElementById('modal-root').innerHTML=''}
    function renderModal(){document.getElementById('modal-root').innerHTML=modal?`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(modal.title)}"><div class="dialog-head"><div><h2>${esc(modal.title)}</h2><p class="small muted" style="margin:0">JoyUMKM · Prototype dashboard</p></div><button class="icon-button" onclick="closeModal()" aria-label="Tutup">${I('x')}</button></div><div class="dialog-body">${modal.body}</div>${modal.foot?`<div class="dialog-footer">${modal.foot}</div>`:''}</div></div>`:''}
    function openEditor(id=''){const u=umkm.find(x=>x.id===id),title=u?'Ubah data UMKM':'Tambah data UMKM';showDialog(title,`<form id="editor-form" class="modal-grid" onsubmit="submitEditor(event,'${id}')"><div class="field full"><label>Nama usaha</label><input class="control" name="name" required maxlength="100" value="${esc(u?.name||'')}" placeholder="Contoh: Toko Maju Bersama"></div><div class="field"><label>Lokasi</label><input class="control" name="location" required maxlength="100" value="${esc(u?.location||'')}" placeholder="Kota atau provinsi"></div><div class="field"><label>Sektor usaha</label><select class="control" name="sector" required><option value="">Pilih sektor</option>${['Makanan & Minuman','Grosir & Retail','Jasa','Fashion','Kerajinan','Lainnya'].map(s=>`<option value="${s}" ${u?.sector===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field full"><label>Omzet bulanan (Rp)</label><input class="control" type="number" name="revenue" min="0" required value="${u?.revenue??0}"></div><div class="full notice">Data disimpan pada browser untuk kebutuhan prototype. Tidak ada permintaan yang dikirim ke server.</div><div class="full between" style="justify-content:end;gap:10px;margin-top:8px">${btn('Batal','closeModal()','btn-light')}<button type="submit" class="btn btn-primary">${I('save')} ${u?'Simpan Perubahan':'Tambahkan UMKM'}</button></div></form>`)}
    function submitEditor(e,id){e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')).trim(),location=String(fd.get('location')).trim(),sector=String(fd.get('sector')),revenue=Number(fd.get('revenue'));if(!name||!location||!sector||!Number.isFinite(revenue)||revenue<0){toast('Lengkapi data dengan benar.');return}if(id){const u=umkm.find(x=>x.id===id);Object.assign(u,{name,location,sector,revenue})}else{const uid='u'+Date.now().toString(36);umkm.push({id:uid,name,location,sector,revenue,score:null,scores:{INS:null,ECT:null,OPS:null},status:'none',answered:0})}save();closeModal();render();toast(id?'Data UMKM berhasil diperbarui.':'UMKM baru berhasil ditambahkan.')}
    function deleteUmkm(id){const u=umkm.find(x=>x.id===id);if(!u)return;showConfirm('Hapus data UMKM?',`Data ${u.name} akan dihapus dari data lokal prototype.`,()=>{umkm=umkm.filter(x=>x.id!==id);selectedCompare=selectedCompare.filter(x=>x!==id);if(selectedFactor===id)selectedFactor=umkm[0]?.id||'';if(selectedForm===id)selectedForm='';delete formSaved[id];save();closeModal();render();toast('Data UMKM dihapus dari prototype.')})}
    function render(){buildNav();let html='';switch(page){case 'factor':html=factorPage();break;case 'distribution':html=distributionPage();break;case 'comparison':html=comparisonPage();break;case 'umkm':html=umkmPage();break;case 'form':html=formPage();break;default:html=homePage()}document.getElementById('app').innerHTML=html;document.title=`${NAV.find(n=>n[0]===page)?.[1]||'Dashboard'} • JoyUMKM`;renderModal()}
    document.getElementById('global-search').addEventListener('input',e=>{umkmSearch=e.target.value;currentPage=1;if(page!=='umkm'){page='umkm';window.location.hash='umkm'}render()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSidebar()}});
    window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(NAV.some(n=>n[0]===p)&&p!==page){page=p;render();window.scrollTo(0,0)}});
    page=NAV.some(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):'home';render();
  </script>
</body>
</html>
